name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      NODE_ENV: test
      DB_URL: mongodb://localhost:27017
      OPENAI_API_KEY: sk-dummy
      RESEND_API_KEY: re_dummy
      TWELVE_LABS_API_KEY: dummy
      ANTHROPIC_API_KEY: dummy
      TWELVELABS_USER_INDEX: dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts skips the @upstash/qstash-cli postinstall, which downloads a binary we do not need.
      - run: npm ci --ignore-scripts

      # Tests use ffmpeg; rebuild only the ffmpeg binaries that were skipped above.
      - run: npm rebuild ffmpeg-static ffprobe-static

      - run: npm test
